[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "value-investing-agent"
version = "0.1.0"
description = "A LangChain/LangGraph/LangMem value-investing screening agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "langchain>=1.0.0",
  "langchain-openai>=1.0.0",
  "langgraph>=1.0.0",
  "langgraph-checkpoint-postgres>=3.0.0",
  "langmem>=0.0.27",
  "langsmith>=0.3.0",
  "psycopg[binary,pool]>=3.2.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.0",
  "tenacity>=8.2.3",
  "yfinance>=0.2.50"
]

[project.scripts]
value-agent = "value_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
